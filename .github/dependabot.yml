version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "rudderlabs/*"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]
  - package-ecosystem: 'bundler'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      bundler-security:
        applies-to: security-updates
        patterns: ['*']
      bundler-deps:
        patterns: ['*']