name: Publish gem

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-gem-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to RubyGems
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ github.event.release.tag_name }}
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out the release event commit
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the release tag still points to the event commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          remote_refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_commit="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<< "$remote_refs")"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<< "$remote_refs")"
          fi
          [[ "$tag_commit" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]

      - name: Set up Ruby
        uses: ruby/setup-ruby@d5126b9b3579e429dd52e51e68624dda2e05be25 # v1.267.0

      - name: Validate the release version
        id: release
        run: |
          version="$(./scripts/publish_gem.sh validate)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the gem
        env:
          GEM_FILE: rudder-sdk-ruby-${{ steps.release.outputs.version }}.gem
        run: gem build rudder-sdk-ruby.gemspec --output "$GEM_FILE"

      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish the gem
        id: push
        env:
          GEM_FILE: rudder-sdk-ruby-${{ steps.release.outputs.version }}.gem
        run: |
          gem push "$GEM_FILE"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

      - name: Verify the published version
        run: ./scripts/publish_gem.sh verify

  acceptance:
    name: Full published gem acceptance
    needs: publish
    uses: ./.github/workflows/validate-published-gem.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      tag: ${{ needs.publish.outputs.tag }}
      commit: ${{ needs.publish.outputs.commit }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify:
    name: Notify release outcome
    if: ${{ always() && needs.publish.outputs.pushed == 'true' }}
    needs: [publish, acceptance]
    uses: ./.github/workflows/slack-notify.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      tag: ${{ needs.publish.outputs.tag }}
      accepted: ${{ needs.publish.result == 'success' && needs.acceptance.result == 'success' }}
      acceptance_status: ${{ needs.publish.result != 'success' && 'registry verification failed or cancelled' || format('full E2E {0}', needs.acceptance.result) }}
      validation_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      retry: false
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_RELEASE_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
