name: Notify published gem outcome

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      accepted:
        type: boolean
        required: true
      acceptance_status:
        type: string
        required: true
      retry:
        type: boolean
        required: true
      validation_url:
        type: string
        required: true
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      SLACK_RELEASE_CHANNEL_ID:
        required: true

permissions: {}

jobs:
  notify:
    name: Notify Slack
    if: ${{ github.repository == 'rudderlabs/rudder-sdk-ruby' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Send message to Slack channel
        uses: slackapi/slack-github-action@007b2c3c751a190b6f0f040e47ed024deaa72844 # v1.23.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          payload: |
            {
              "text": "Ruby(Async) SDK ${{ inputs.version }}: ${{ inputs.accepted && (inputs.retry && 'accepted after validation-only retry (not republished)' || 'release complete: exact RubyGems package verified and full E2E accepted') || format('published, acceptance {0}', inputs.acceptance_status) }}. Validation: ${{ inputs.validation_url }}. Release: https://github.com/rudderlabs/rudder-sdk-ruby/releases/tag/${{ inputs.tag }}"
            }
